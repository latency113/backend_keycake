services:
  # ╭─ postgres ─────────────────────────────────────────────────────────╮
  postgres:
    image: postgres
    container_name: db_nvc_cake
    restart: unless-stopped # unless-stopped, on-failure, always, "no"
    user: postgres
    environment:
      - POSTGRES_DB=nvc_cake
      - POSTGRES_PASSWORD=JBMewq8xdyf13s
      - POSTGRES_USER=nvc_cake
    ports:
      - 5432:5432
    volumes:
      - ./db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", -U, postgres ]
      interval: 10s
      timeout: 5s
      retries: 5
